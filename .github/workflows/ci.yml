name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

# Self-hosted, as in every other workflow in the organisation: GitHub-hosted
# runners are billing-gated on this account. The lint/test job runs inside the
# same pinned Rust image the Dockerfile builds with, so CI, image and local
# `cargo test` share one toolchain.
jobs:
  lint-test:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-slim-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  build-image:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A build-only check; pushing to a registry starts once releases do.
      - name: Docker build
        run: docker build --pull -t tucanotime:${{ github.sha }} .

  actionlint:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  # Secret scanning (#49): full git history via the pinned gitleaks image. The
  # digest is pinned (matching the sibling project's supply-chain discipline)
  # so a tag re-push cannot silently change the scanner.
  secret-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact

  # Supply-chain (#53): dependency advisories + licenses via cargo-deny (the
  # gate), plus a best-effort CycloneDX SBOM artifact.
  supply-chain:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-slim-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install git (advisory-db clone) and cargo-deny
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git
          cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check advisories licenses sources bans

      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json
          ls -l target/cyclonedx

      - name: Upload SBOM
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/cyclonedx/*.cdx.json

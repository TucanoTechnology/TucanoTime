# Dependabot version updates for TucanoTime.
#
# Only github-actions applies until the project introduces its own ecosystems
# (language toolchains, container images); add those here as they appear.
# CI on each PR validates the new pin and a human merges — pins never move
# silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

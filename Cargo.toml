[package]
name = "tucano-time"
version = "0.1.0"
description = "Timesheet system: daily and weekly time entries, customers and project codes with currencies and rates"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.98"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
rust-embed = "8.12.0"
fs2 = "0.4.3"
flate2 = "1"
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
aes-gcm = { version = "0.11", features = ["getrandom"] }
ureq = "3"
pdf-writer = "0.15.0"
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
sha2 = "0.11"
lopdf = { version = "0.45.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
